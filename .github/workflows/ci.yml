name: ci

# Quanta compiler continuous integration.
#
# Runs on every push/PR to main. Stages (all must pass or the build is RED):
#   1. Self-host build  - rebuild the current compiler from source via the
#      3-stage bootstrap (committed qc -> qc_boot -> qc_self -> qc). Proves the
#      source still self-hosts (fixed-point invariant).
#   2. Functional gate  - test_suites/scripts/run_tests.sh (functional + security
#      + perf layers). A compile-fail or wrong exit code fails the build.
#   3. Fuzz             - tools/fuzz/fuzz_qc.py: random .quanta input must NEVER
#      crash qc (fail-closed). Expects rc in {0,1,7,13,14,15,16,17}.
#   4. Differential      - tools/diff_test/diff_qc.py: current qc vs the committed
#      qc must agree on exit codes for reference programs.
#
# Current version: 0.0.54 (grammar/bug-fix window closed; gate 81/81 GREEN).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-host build (3-stage) from committed qc
        working-directory: compiler/0.0.54/src/x86
        run: |
          set -e
          SEED=../../../../compiler/0.0.54/bin/x86/qc
          test -x "$SEED" || { echo "committed qc seed missing"; exit 1; }
          "$SEED" main.quanta qc_boot
          test -x qc_boot || { echo "qc_boot not produced"; exit 1; }
          ./qc_boot main.quanta qc_self
          test -x qc_self || { echo "qc_self not produced"; exit 1; }
          ./qc_self main.quanta qc
          test -x qc || { echo "qc not produced"; exit 1; }
          chmod +x qc
          echo "self-host OK: $(md5sum qc | cut -d' ' -f1)"

      - name: Functional gate (run_tests.sh)
        env:
          QC: compiler/0.0.54/src/x86/qc
        run: bash test_suites/scripts/run_tests.sh

      - name: Fuzz (fail-closed proof)
        run: |
          set -e
          python3 tools/fuzz/fuzz_qc.py --qc compiler/0.0.54/src/x86/qc --iter 5000

      - name: Differential (cross-check vs committed qc)
        run: |
          set -e
          python3 tools/diff_test/diff_qc.py \
            --current compiler/0.0.54/src/x86/qc \
            --seed compiler/0.0.54/bin/x86/qc
