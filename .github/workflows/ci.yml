name: ci

# Quanta compiler continuous integration.
#
# Runs on every push/PR to main. The compiler under test is the committed
# golden self-hosting binary at compiler/0.0.97/bin/x86/qc (built and verified
# at the 0.0.97 feature release; valgrind-clean). Every stage must pass or the
# build is RED:
#   1. Compiler present  - the golden bin/x86/qc exists and is executable.
#   2. Functional gate   - test_suites/scripts/run_tests.sh (functional +
#      security + perf layers). A compile-fail or wrong exit code fails the build.
#   3. Valgrind scan     - run the golden qc under Valgrind to catch real memory
#      unsafety (OOB writes, use-after-free) the functional gate misses.
#   4. Fuzz              - tools/fuzz/fuzz_qc.py: random .quanta input must NEVER
#      crash qc (fail-closed). Expects rc in {0,1,7,13,14,15,16,17}.
#   5. Differential       - tools/diff_test/diff_qc.py: current qc vs the committed
#      qc must agree on exit codes for reference programs.
#
# Self-host: the 0.0.97 compiler now compiles the 0.0.97 source FAITHFULLY
# (2-stage self-host verified byte-identical to the golden binary, 138/138 gate).
# The "Self-host rebuild" step rebuilds from source with the golden binary and
# re-runs the gate; it is NON-BLOCKING (continue-on-error) as a belt-and-braces
# check that the shipped compiler still bootstraps itself.
#
# Current version: 0.0.97 (operator overloading for all 11 binary/relational ops via the OPFN fn-index table + IR_CALL_IDX; range `..` feeds `for`; self-host fixpoint byte-identical, 138/138 gate). Golden compiler: compiler/0.0.97/bin/x86/qc.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Read version
        id: ver
        run: |
          V=$(cat VERSION)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "version=$V"

      - name: Verify golden compiler present
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          QC=compiler/$V/bin/x86/qc
          test -x "$QC" || { echo "golden compiler $QC missing"; exit 1; }
          echo "golden qc ($V): $(md5sum $QC | cut -d' ' -f1)"

      - name: IR opcode uniqueness (structural guard)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          # 0.0.65 shipped `let IR_CLOSURE = 72` while 72 was already IR_APUSH.
          # parse_let tags fn-value RHS via irop(lr)==IR_CLOSURE, so every array
          # push was misread as a closure and its result vreg corrupted: the
          # array grew but the pushed element read back as 0. Silent wrong data,
          # no diagnostic, and the whole functional gate stayed green because no
          # test pushed onto an array. Fail the build on ANY duplicate opcode so
          # this class cannot recur by convention alone.
          V=${{ steps.ver.outputs.version }}
          G=compiler/$V/src/x86/globals.quanta
          DUPS=$(grep -oE '^let IR_[A-Z_0-9]+ = [0-9]+' "$G" \
                   | awk '{print $4}' | sort -n | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "FAIL: duplicate IR opcode value(s): $DUPS"
            for v in $DUPS; do
              echo "  value $v is used by:"
              grep -nE "^let IR_[A-Z_0-9]+ = $v\$" "$G" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "OK: all IR opcode values unique ($(grep -cE '^let IR_[A-Z_0-9]+ = [0-9]+' "$G") opcodes)"

      - name: Functional gate (run_tests.sh)
        working-directory: ${{ github.workspace }}
        env:
          QC: compiler/${{ steps.ver.outputs.version }}/bin/x86/qc
          PERF_BASELINE_MS: "60000"
        run: |
          # The runner wraps this step in `bash -e`; the gate legitimately exits
          # non-zero when red, so append `|| true` to let the log print below
          # instead of aborting the step before `cat`.
          bash test_suites/scripts/run_tests.sh > /tmp/gate.log 2>&1 || true
          cat /tmp/gate.log
          grep -qE "functional : RED|FAIL \(compile\)|FAIL [a-z]+_.*quanta|FAIL [a-z]+_[a-z]+ \(" /tmp/gate.log && exit 1 || true

      - name: Valgrind scan of qc for memory unsafety
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          valgrind --error-exitcode=42 --leak-check=summary \
            compiler/$V/bin/x86/qc test_suites/codes/simple.quanta /tmp/val_smoke.bin 2> /tmp/vg.log
          echo "Valgrind: no errors reported"

      - name: Fuzz (fail-closed proof)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          python3 tools/fuzz/fuzz_qc.py --qc compiler/$V/bin/x86/qc --iter 5000

      - name: Differential (cross-check vs committed qc)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          python3 tools/diff_test/diff_qc.py \
            --current compiler/$V/bin/x86/qc \
            --seed compiler/$V/bin/x86/qc

      - name: Self-host rebuild (2-stage from 0.0.87 source — now faithful)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          V=${{ steps.ver.outputs.version }}
          SEED="$GITHUB_WORKSPACE/compiler/$V/bin/x86/qc"
          test -x "$SEED" || { echo "SELFHOST seed missing"; exit 0; }
          cd "$GITHUB_WORKSPACE/compiler/$V/src/x86"
          "$SEED" main.quanta qc_rebuilt 2>&1 | tail -3 || true
          if [ -x qc_rebuilt ]; then
            cd "$GITHUB_WORKSPACE"
            QC="$GITHUB_WORKSPACE/compiler/$V/src/x86/qc_rebuilt" PERF_BASELINE_MS=60000 bash test_suites/scripts/run_tests.sh > /tmp/selfhost.log 2>&1 || true
            echo "SELFHOST $(grep -E 'Results:|functional :' /tmp/selfhost.log | head -3)"
          else
            echo "SELFHOST qc_rebuilt not produced"
          fi
