name: ci

# Quanta compiler continuous integration.
#
# Runs on every push/PR to main. Stages (all must pass or the build is RED):
#   1. Self-host build  - rebuild the current compiler from source using the
#      committed 0.0.63 bootstrap qc as the seed. The 0.0.63 qc is a faithful
#      seed for 0.0.64 (1-stage build passes the full 93/93 functional gate and
#      is valgrind-clean). This proves the 0.0.64 source still compiles to a
#      working, memory-safe compiler.
#   2. Functional gate  - test_suites/scripts/run_tests.sh (functional + security
#      + perf layers). A compile-fail or wrong exit code fails the build.
#   3. Valgrind scan    - run the freshly built qc under Valgrind to catch real
#      memory unsafety (OOB writes, use-after-free) the functional gate misses.
#   4. Fuzz             - tools/fuzz/fuzz_qc.py: random .quanta input must NEVER
#      crash qc (fail-closed). Expects rc in {0,1,7,13,14,15,16,17}.
#   5. Differential      - tools/diff_test/diff_qc.py: current qc vs the committed
#      qc must agree on exit codes for reference programs.
#
# Current version: 0.0.64 (modules). Bootstrap seed: compiler/0.0.63/bin/x86/qc.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build qc from source (seed = committed 0.0.63 qc)
        working-directory: compiler/0.0.64/src/x86
        run: |
          set -e
          SEED=../../../../compiler/0.0.63/bin/x86/qc
          test -x "$SEED" || { echo "bootstrap seed qc missing"; exit 1; }
          "$SEED" main.quanta qc
          test -x qc || { echo "qc not produced"; exit 1; }
          chmod +x qc
          echo "build OK: $(md5sum qc | cut -d' ' -f1)"

      - name: Functional gate (run_tests.sh)
        id: gate
        env:
          QC: compiler/0.0.64/src/x86/qc
          # Generous regression-guard baseline. CI runners are shared/throttled
          # vCPUs, so the perf kernel can run far slower than a dev box; the
          # baseline exists to catch gross optimizer regressions, not runner noise.
          PERF_BASELINE_MS: "60000"
        run: |
          set -e -o pipefail
          bash test_suites/scripts/run_tests.sh 2>&1 | tee /tmp/gate.log

      - name: DIAG commit gate log to repo (debug only, remove later)
        if: failure()
        run: |
          cp /tmp/gate.log CI_DIAG.md
          git config user.email "ci-diag@noreply"
          git config user.name "CI DIAG"
          git add -f CI_DIAG.md
          git commit -m "DIAG gate log $(date +%s)" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Valgrind scan of qc for memory unsafety
        run: |
          set -e
          valgrind --error-exitcode=42 --leak-check=summary \
            compiler/0.0.64/src/x86/qc test_suites/codes/simple.quanta /tmp/val_smoke.bin 2> /tmp/vg.log
          echo "Valgrind: no errors reported"

      - name: Fuzz (fail-closed proof)
        run: |
          set -e
          python3 tools/fuzz/fuzz_qc.py --qc compiler/0.0.64/src/x86/qc --iter 5000

      - name: Differential (cross-check vs committed qc)
        run: |
          set -e
          python3 tools/diff_test/diff_qc.py \
            --current compiler/0.0.64/src/x86/qc \
            --seed compiler/0.0.63/bin/x86/qc
