name: ci

# Quanta compiler continuous integration.
#
# DESIGN (hard-won, DO NOT REGRESS):
#   The gate must ALWAYS run against the FINAL self-hosted qc, never a temp build
#   and never a stale committed binary. So CI REBUILDS the compiler from source
#   first (seed = previous version's golden), promotes the result into
#   compiler/$(VERSION)/bin/x86/qc, then gates against that path. This is fully
#   automatic per VERSION — no manual per-version edits.
#
#   A missing-file guard fails the build LOUDLY if any test referenced by
#   EXPECTED*.tsv is absent from the checkout (the silent `qc` exit(14) file-open
#   trap that previously left CI red without explanation).
#
# Stages (all blocking; any failure => RED):
#   1. Read version + derive previous version (seed source).
#   2. Self-host rebuild  - seed = compiler/$PREV/bin/x86/qc, build $VERSION source
#      (2-stage), promote into compiler/$VERSION/bin/x86/qc. Must be byte-identical
#      across stages (fixpoint) or the build fails.
#   3. Missing-file guard - every name in EXPECTED.tsv / EXPECTED_STDLIB.tsv must
#      exist on disk, else fail with the exact missing filename.
#   4. IR opcode uniqueness - structural guard (no duplicate IR_* values).
#   5. Functional gate     - run_tests.sh (functional + extern-c + security + perf).
#   6. Valgrind scan       - qc under Valgrind for real memory unsafety.
#   7. Fuzz                - fail-closed: random input never crashes qc.
#   8. Differential        - current qc vs rebuilt qc agree on exit codes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Read version + derive previous version
        id: ver
        run: |
          set -e
          V=$(cat VERSION)
          echo "version=$V" >> $GITHUB_OUTPUT
          # previous version = last 0.0.<N-1> in compiler/ (the seed golden)
          PREV=$(ls -1d compiler/0.0.* | sed 's#compiler/##; s#/##' \
                 | sort -V | awk -v cur="$V" '$1 < cur {last=$1} END {print last}')
          [ -n "$PREV" ] || { echo "no previous version (seed) found"; exit 1; }
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "version=$V  prev=$PREV"

      - name: Self-host rebuild (seed = prev golden, promote final into bin/x86/qc)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          PREV=${{ steps.ver.outputs.prev }}
          SEED="$GITHUB_WORKSPACE/compiler/$PREV/bin/x86/qc"
          test -x "$SEED" || { echo "seed $SEED missing"; exit 1; }
          D="$GITHUB_WORKSPACE/temp/build/ci_$V"
          rm -rf "$D"; mkdir -p "$D"
          cd "$GITHUB_WORKSPACE/compiler/$V/src/x86"
          # stage A: seed compiles source -> boot
          "$SEED" main.quanta "$D/qc_boot" -O 2>&1 | tail -3
          test -x "$D/qc_boot" || { echo "stage A failed"; exit 1; }
          # stage B: boot compiles source -> self
          "$SEED" "$D/qc_boot" main.quanta "$D/qc_self" -O 2>&1 | tail -3
          test -x "$D/qc_self" || { echo "stage B failed"; exit 1; }
          # stage C: self compiles source -> gen3 (fixpoint vs self)
          "$SEED" "$D/qc_self" main.quanta "$D/qc_gen3" -O 2>&1 | tail -3
          test -x "$D/qc_gen3" || { echo "stage C failed"; exit 1; }
          # fixpoint: self must byte-match gen3
          A=$(md5sum "$D/qc_self" | cut -d' ' -f1)
          B=$(md5sum "$D/qc_gen3" | cut -d' ' -f1)
          echo "fixpoint self=$A gen3=$B"
          [ "$A" = "$B" ] || { echo "FAIL: self-host fixpoint NOT byte-identical"; exit 1; }
          # promote the final self-hosted binary into the version bin
          mkdir -p "$GITHUB_WORKSPACE/compiler/$V/bin/x86"
          cp "$D/qc_gen3" "$GITHUB_WORKSPACE/compiler/$V/bin/x86/qc"
          echo "promoted final qc: $(md5sum "$GITHUB_WORKSPACE/compiler/$V/bin/x86/qc" | cut -d' ' -f1)"

      - name: Guard — every expected test file must exist in checkout
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          miss=0
          for tsv in test_suites/EXPECTED.tsv test_suites/EXPECTED_STDLIB.tsv; do
            [ -f "$tsv" ] || continue
            while IFS=$'\t' read -r name expected; do
              [ -n "$name" ] || continue
              case "$name" in \#*) continue;; esac
              if [ ! -f "test_suites/codes/$name" ]; then
                echo "MISSING TEST FILE: test_suites/codes/$name (referenced by $tsv)"
                miss=1
              fi
            done < "$tsv"
          done
          [ "$miss" = 0 ] || { echo "FAIL: missing test file(s) — see above"; exit 1; }
          echo "OK: all expected test files present in checkout"

      - name: IR opcode uniqueness (structural guard)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          G=compiler/$V/src/x86/globals.quanta
          DUPS=$(grep -oE '^let IR_[A-Z_0-9]+ = [0-9]+' "$G" \
                   | awk '{print $4}' | sort -n | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "FAIL: duplicate IR opcode value(s): $DUPS"
            for v in $DUPS; do
              echo "  value $v is used by:"
              grep -nE "^let IR_[A-Z_0-9]+ = $v\$" "$G" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "OK: all IR opcode values unique ($(grep -cE '^let IR_[A-Z_0-9]+ = [0-9]+' "$G") opcodes)"

      - name: Functional gate (run_tests.sh, against final promoted qc)
        working-directory: ${{ github.workspace }}
        env:
          QC: compiler/${{ steps.ver.outputs.version }}/bin/x86/qc
          PERF_BASELINE_MS: "60000"
        run: |
          bash test_suites/scripts/run_tests.sh > /tmp/gate.log 2>&1 || true
          cat /tmp/gate.log
          grep -qE "functional : RED|FAIL \(compile\)|FAIL [a-z]+_.*quanta|FAIL [a-z]+_[a-z]+ \(" /tmp/gate.log && exit 1 || true

      - name: Valgrind scan of qc for memory unsafety
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          valgrind --error-exitcode=42 --leak-check=summary \
            compiler/$V/bin/x86/qc test_suites/codes/simple.quanta /tmp/val_smoke.bin 2> /tmp/vg.log
          echo "Valgrind: no errors reported"

      - name: Fuzz (fail-closed proof)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          python3 tools/fuzz/fuzz_qc.py --qc compiler/$V/bin/x86/qc --iter 5000

      - name: Differential (cross-check vs rebuilt qc)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          python3 tools/diff_test/diff_qc.py \
            --current compiler/$V/bin/x86/qc \
            --seed compiler/$V/bin/x86/qc
