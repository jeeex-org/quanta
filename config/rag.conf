# rag.conf - RAG + TI (Tali Intelligence) configuration for Quanta
#
# PURPOSE
#   Every filesystem location, endpoint and runtime knob that RAG and TI use
#   lives HERE, not in Quanta source. Moving a tree means editing this file --
#   lib/std/rag.quanta and the scripts/*.py helpers never change.
#
# FORMAT
#   key = value            one per line
#   # comment              ignored
#   [section]             keys belong to the section that precedes them
#   ${section.key}        expanded from any other key in this file
#
#   Every reference names a real section.key. A bare ${TI} shorthand was tried
#   first and resolved to empty -- there is no key named TI, only `root` inside
#   [ti] -- which silently collapsed every path to "/...". A typo here is a
#   lookup that finds nothing, not a wrong substitution.
#
#   Values are literal -- no shell expansion, no quoting, no escapes. A value
#   runs to end of line; surrounding spaces are trimmed. There is no escape
#   mechanism, by design: a path needs none, and an escape syntax is a second
#   thing to get wrong.
#
# LOOKUP ORDER (first hit wins)
#   1. this file
#   2. the built-in default compiled into lib/std/config.quanta
#
#   There is deliberately no environment override. `getenv` exists in the
#   language but is a stub -- it returns 0 for a variable that IS set -- so an
#   env-based override would be a knob that silently does nothing. The config
#   FILE is the single source of truth, and moving a tree means editing the one
#   `root` value below.
#
# CHANGING A PATH
#   Edit the value, then re-run the build. Nothing else. Scripts read this file
#   through config_get(); they do not hardcode a second copy of any path below.

# ---------------------------------------------------------------------------
# TI -- Tali Intelligence. The root; every other TI path is relative to it.
# ---------------------------------------------------------------------------
[ti]
# The one value you will most likely edit. Everything below derives from it.
root   = /opt/tali/ti
ai     = ${ti.root}/ai
kb     = ${ti.root}/kb
kb_ext = ${ti.root}/kb-ext

# ---------------------------------------------------------------------------
# RAG -- the vector store.
# ---------------------------------------------------------------------------
[rag]
# sqlite3 database. 21 GB, 2.8M chunks, carries the vec0 virtual table.
db = ${ti.ai}/rag/vectors.db

# Sidecars sqlite creates beside the db. Not written by us, listed so a copy or
# move knows to include them -- a bare `cp vectors.db` loses the WAL.
db_wal = ${rag.db}-wal
db_shm = ${rag.db}-shm

# Scratch file for the query text handed to the embedder. /tmp by convention:
# it is per-run and must not live beside the db.
query_file = /tmp/rag_query.txt

# Where build/test scripts write their output.
stats_file   = ${ti.ai}/rag/stats.json
results_file = ${ti.ai}/rag/test_results.json

# Row limit for a search, and how many chunks enter a prompt.
default_top_k = 5
context_chunks = 3

# ---------------------------------------------------------------------------
# EMBEDDING -- python3 sentence-transformers.
# ---------------------------------------------------------------------------
[embed]
# Interpreter that has sentence-transformers installed. The `python3` on PATH is
# a 3.14 build WITHOUT the ML stack, so a bare `python3` cannot embed.
#
# SET to /usr/bin/python3 (3.12.14). The earlier "no interpreter was found" note
# was WRONG: it tested only the 3.14 `python3` on PATH. /usr/bin/python3 has the
# whole stack in the user site:
#   ~/.local/lib/python3.12/site-packages  -- sentence-transformers 5.6.0,
#   torch 2.10.0+cu128, numpy 2.5.1, transformers 5.5.0, sqlite-vec 0.1.9.
# Nothing had to be installed; the packages were already there. Verified:
#   $ /usr/bin/python3 -c "import sentence_transformers, sqlite_vec"   # ok
# The embeddings AND the vec0 KNN index ARE present in the db (2,862,440
# chunks), so with this set the query encoder exists and the loop's retrieval is
# semantic, not a keyword grep.
# CAVEAT: rag_search() in lib/std/rag.quanta shells out to the `sqlite3` CLI with
# vec_distance_euclidean(). That CLI is NOT installed on this host and
# vec_distance_euclidean is not a sqlite-vec function name, so the in-language
# SEARCH half is still broken -- drive KNN through scripts/fast_rag.py (loads the
# sqlite_vec extension properly) until rag_search is fixed.
python = /usr/bin/python3

# Reads the query from a file rather than argv: a file survives spaces, quotes
# and newlines in the query with no shell quoting.
script = /opt/tali/quanta/scripts/rag_embed_file.py

# The EMBEDDING model, by sentence-transformers model NAME. Not a directory:
# this is resolved through the HuggingFace cache, and the weights are present at
#   ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
#
# This is NOT [models] (below), which is the GGUF inference models. The two are
# unrelated: `embedding` in the chunks table is a BLOB of THIS model's output,
# so changing it invalidates all 2.8M stored vectors -- rebuild the db rather
# than mixing two embedding spaces.
model = all-MiniLM-L6-v2

# Dimension of the stored vectors. Verified against the database: a stored
# `embedding` blob is 1536 bytes = 384 float32 values, which matches
# all-MiniLM-L6-v2. Recorded so a mismatch is caught at load rather than
# producing silently meaningless distances.
dim = 384

# ---------------------------------------------------------------------------
# GENERATION -- llama-server / any OpenAI-compatible endpoint.
# ---------------------------------------------------------------------------
[llm]
# Scheme and host. The port is per-model and comes from [models] below.
base = http://localhost

# Request shape. Sent verbatim as the JSON body.
path   = /v1/chat/completions
max_tokens = 256
# Stored as integers because the language has no decimal parser for config
# values: temperature in tenths, top_p in hundredths. config.quanta divides.
temperature     = 3
top_p           = 95
enable_thinking = false

# The prompt is instructed to answer only from retrieved context and to disallow
# naming other languages. Kept here so the retrieval contract is editable
# without touching rag.quanta's prompt assembly.
context_header = CONTEXT FROM QUANTA SOURCE:

# ---------------------------------------------------------------------------
# MODELS -- name -> port. `rag_query(q, model)` looks the port up by name.
# ---------------------------------------------------------------------------
[models]
e2b = 1235
e4b = 1236

# ---------------------------------------------------------------------------
# FINETUNE -- the LFM base models and their datasets.
#
# These live on the TI tree because the Quanta NATIVE loader reads them, and so
# does the finetuning. /opt/ai/models/quanta is a DIFFERENT tree: that one is
# llama-server's, and the two are not interchangeable.
# ---------------------------------------------------------------------------
[finetune]
# Base models. `base` is what the QLoRA scripts load; `unsloth_8b` is the
# pre-converted 8B used by the deepspeed/CPU runs.
models = /opt/tali/ti/ai/models
base   = /opt/tali/ti/ai/models/lfm2.5-2b6
base8b = /opt/tali/ti/ai/models/lfm2.5-8b-a1b
unsloth_8b = /opt/tali/ti/ai/models/unsloth-lfm2.5-8b-a1b

# GGUF weights. The native loader reads GGUF (lib/std/native_inference.quanta
# defines GGUFHeader), so these are native-loader assets, not llama-server's.
gguf_24b = /opt/tali/ti/ai/models/lfm2-24b-a2b-gguf
gguf_2b6 = /opt/tali/ti/ai/models/lfm2.5-2b6.gguf
gguf_2b6_q4 = /opt/tali/ti/ai/models/lfm2.5-2b6-Q4_K_M.gguf

# Datasets, oldest first. hq is 23 MB against 1.5 MB for the original, so it is
# the one the later phases train on.
data_dir   = /opt/tali/quanta/training_data
data_base  = /opt/tali/quanta/training_data/quanta_finetune.jsonl
data_ext   = /opt/tali/quanta/training_data/quanta_finetune_extended.jsonl
data_hq    = /opt/tali/quanta/training_data/quanta_finetune_hq.jsonl

# Where a run writes checkpoints. One directory per phase, named for it.
output_dir = /opt/tali/quanta/output

# ---------------------------------------------------------------------------
# KNOWLEDGE BASE -- the markdown corpus, independent of the vector store.
# ---------------------------------------------------------------------------
[kb]
# Corpus root and the files that index it.
root  = ${ti.kb}
index = ${kb.root}/INDEX.md
graph = ${kb.root}/graph.json

# Where a built corpus is expected to be materialised for embedding.
source = ${kb.root}/embed

# ---------------------------------------------------------------------------
# SKILLS -- agent skill libraries.
# ---------------------------------------------------------------------------
[skills]
# Hermes' own skills live in the user profile, not in TI. Listed explicitly
# because "skills" is not one directory.
hermes = /home/tali/.hermes/skills
ti     = ${ti.kb}/skills

# ---------------------------------------------------------------------------
# EXTERNAL TOOLS -- invoked by name, resolved from PATH.
# ---------------------------------------------------------------------------
[tools]
sqlite3 = sqlite3
curl    = curl
